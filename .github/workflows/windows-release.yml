name: Windows build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Run security smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/security_smoke.py

      - name: Run layout and behavior tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/self_test.py
          python tests/behavior_test.py
          python tests/performance_regression.py
          python tests/stability_regression.py

      - name: Build portable package
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          .\scripts\build-windows.ps1 -PythonPath python -SkipInstall -Version $releaseVersion

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KomariDesktop-windows
          path: |
            release/*.zip
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "release\*.zip" `
            "release\SHA256SUMS.txt" `
            --verify-tag `
            --generate-notes `
            --title "KomariDesktop $env:GITHUB_REF_NAME"
